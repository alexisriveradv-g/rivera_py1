[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivera_py1"
version = "0.1.0"
description = "Paquete de estadisticas descriptivas y deteccion de atipicos"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "pandas", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
include = ["rivera_py1*"]
